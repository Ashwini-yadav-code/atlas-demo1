<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<script src="shared/atlas-auth-gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community — Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/atlas-design-system.css">
<link rel="stylesheet" href="shared/atlas-extended.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  .cd-split{ display:grid; grid-template-columns:1.6fr 1fr; gap:22px; align-items:start; margin-top:22px; }
  @media (max-width:1000px){ .cd-split{ grid-template-columns:1fr; } }
  .cd-side > * + *{ margin-top:22px; }
  .req-list{ list-style:none; display:flex; flex-direction:column; gap:10px; padding:0 20px 20px; }
  .req-list li{ display:flex; gap:10px; font-size:13.5px; color:var(--ink-soft); line-height:1.5; }
  .req-list svg{ width:15px; height:15px; color:var(--green); flex:none; margin-top:2px; }
  .author-row{ display:flex; align-items:center; gap:10px; padding:0 20px 20px; }
  .author-row img{ width:36px; height:36px; border-radius:50%; object-fit:cover; }
  .author-row b{ font-size:13.5px; }
  .author-row span{ display:block; font-size:12px; color:var(--ink-soft); }
</style>
</head>
<body>

  <div class="spotlight" id="spotlight"><div class="spotlight-glow" id="spotlightGlow"></div></div>

  <div class="screen">
    <div class="app">
      <nav class="sidebar" id="sidebarRail" aria-label="Tools">
        <div class="side-btn" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
        <div class="side-btn" title="Messages" onclick="location.href='messaging.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="side-dot"></span></div>
        <div class="side-btn" title="Document vault" onclick="location.href='checklist.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg></div>
        <div class="side-btn" title="Help &amp; support"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 2-2.4 3.7"/><path d="M12 17.2v.1"/></svg></div>
        <div class="side-gap"></div>
        <div class="side-btn" title="Settings" onclick="location.href='profile.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg></div>
        <div class="side-btn" id="themeToggle" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </div>
      </nav>

      <div class="main">
        <div class="topbar">
          <div class="brand">
            <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2L2 21h20L12 2z"/><path d="M12 9l4.5 9h-9L12 9z" opacity=".5"/></svg></span>
            atlas
          </div>
          <div class="topbar-back">
            <div class="back-btn" id="backBtn" role="button" tabindex="0">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              Back
            </div>
            <div class="breadcrumb"><a href="index.html" style="color:inherit; text-decoration:none;">Community</a><span class="sep">/</span><span class="current" id="crumbTitle">Guide</span></div>
          </div>
          <div class="top-right">
            <div class="icon-btn" title="Notifications" onclick="location.href='notifications.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="side-dot"></span></div>
            <div class="profile-btn" title="Account menu" onclick="location.href='profile.html'">
              <div class="avatar-ring"><img src="https://i.pravatar.cc/100?img=47" alt="Harman"></div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="11" height="11"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>

        <div class="view active" id="detailView">
          <div class="detail-hero">
            <div>
              <span class="comm-card eyebrow" id="itemEyebrow" style="font-size:11.5px; color:var(--ink-soft); font-weight:600;"></span>
              <h1 id="itemTitle" style="margin-top:6px;">Loading…</h1>
            </div>
            <div class="detail-actions">
              <button class="btn btn-primary" id="itemCta">Apply</button>
            </div>
          </div>

          <div class="focus-card reveal" id="rsvpCard" style="display:none;">
            <div class="focus-count" id="rsvpCount">24<small>going</small></div>
            <div class="focus-body">
              <h2 id="rsvpHeadline">Spots are filling up</h2>
              <p id="rsvpBody"></p>
            </div>
            <button type="button" class="focus-cta" id="rsvpCta">RSVP</button>
          </div>

          <div class="cd-split">
            <div class="cd-main">
              <div class="card reveal">
                <div class="detail-body" style="padding:22px 24px;" id="itemBody"></div>
              </div>
            </div>

            <div class="cd-side">
              <div class="card reveal" id="factsCard">
                <div class="panel-head"><h3 id="factsTitle">Details</h3></div>
                <div class="fact-grid" style="padding:0 20px 20px; grid-template-columns:1fr;" id="factsBody"></div>
              </div>

              <div class="card reveal" id="reqCard" style="display:none;">
                <div class="panel-head"><h3>What you'll need</h3></div>
                <ul class="req-list" id="reqList"></ul>
              </div>

              <div class="card reveal" id="authorCard" style="display:none;">
                <div class="panel-head"><h3>Written by</h3></div>
                <div class="author-row" id="authorRow"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="shared/atlas-shared.js"></script>
<script>
(function(){
  const ITEMS = {
    job: {
      lib: {
        title: 'Library assistant, University of Manchester', eyebrow: 'Part-time · Manchester',
        cta: 'Apply now',
        body: [
          "The University of Manchester library is hiring part-time student assistants for the autumn term, shelving, circulation-desk support and helping first-years find their way around during the busiest weeks of term.",
          "Shifts are scheduled around your timetable and stay within standard Tier 4 / Student visa work-hour limits during term time."
        ],
        facts: [['Hours', '18 hrs/week'], ['Pay', '£11.90/hr'], ['Location', 'Main Library, Oxford Road'], ['Start', 'Late September']],
        reqs: ['Valid Student visa with work rights', 'Available at least 2 weekday evenings', 'No prior experience required']
      },
      intern: {
        title: 'Content intern, student-run publication', eyebrow: 'Part-time · Remote',
        cta: 'Apply now',
        body: [
          "A student-run publication covering UK campus life for international students is looking for a part-time content intern to write and edit short explainer pieces.",
          "Fully remote and asynchronous — a portfolio-building role that fits around lectures and coursework."
        ],
        facts: [['Hours', 'Flexible'], ['Pay', '£10.50/hr'], ['Location', 'Remote'], ['Start', 'Rolling']],
        reqs: ['Strong written English', 'A short writing sample on request', 'Visa work-hour limits still apply']
      },
      analyst: {
        title: 'Junior analyst, fintech scale-up', eyebrow: 'Graduate route',
        cta: 'Apply now',
        body: [
          "A London-based fintech scale-up is hiring junior analysts on its graduate route, with sponsorship for the Skilled Worker visa for candidates who need it after graduation.",
          "Ideal for final-year Data Science or Statistics students who want a role lined up before their Graduate visa clock starts."
        ],
        facts: [['Hours', 'Full-time'], ['Pay', '£34,000/yr'], ['Location', 'London'], ['Start', 'Sept 2026']],
        reqs: ['Final-year or recent graduate', 'Comfortable with SQL and Python', 'Sponsors Skilled Worker visa applicants']
      }
    },
    event: {
      briefing: {
        title: 'Pre-departure briefing: what to pack', eyebrow: '3 Sept · Online', cta: 'RSVP',
        rsvp: { going: 112, headline: '38 spots left of 150', body: "This one fills up fast every intake — RSVP now to get the calendar invite and the packing-list PDF beforehand." },
        body: [
          "A live online session hosted by students already settled in Manchester, covering exactly what to pack, what to buy after you land, and what customs rules actually apply to Indian students flying into the UK.",
          "Recording shared with all RSVPs afterward, so it's fine to join if the time doesn't quite line up with IST."
        ],
        facts: [['Date', '3 September, 7:00 PM IST'], ['Format', 'Online — Zoom'], ['Hosted by', 'Manchester student community'], ['Capacity', '150 spots']],
        attendees: true
      },
      meetup: {
        title: 'New arrivals meetup', eyebrow: '10 Sept · Leeds', cta: 'RSVP',
        rsvp: { going: 27, headline: '13 spots left of 40', body: 'In-person and capped small on purpose — RSVP to hold your spot for the campus walk-through.' },
        body: [
          "Coffee, SIM cards and a campus walk-through for students who've just landed in Leeds — meet a few people before your first lecture.",
          "Organised by the Atlas community team with a couple of second-year students who did this exact walk-through last year."
        ],
        facts: [['Date', '10 September, 4:00 PM'], ['Format', 'In person'], ['Location', 'Leeds Students’ Union'], ['Capacity', '40 spots']],
        attendees: true
      },
      bankqa: {
        title: 'Opening your bank account, live Q&A', eyebrow: '14 Sept · Online', cta: 'RSVP',
        rsvp: { going: 84, headline: '116 spots left of 200', body: "Bring your specific questions — the partner bank's team stays on after the session to answer them one-on-one." },
        body: [
          "A partner bank's student onboarding team answers questions live about opening a UK account before or shortly after you land — bring your specific documentation questions.",
          "Especially useful if your CAS letter or BRP timing is unusual and you're not sure which account option applies to you."
        ],
        facts: [['Date', '14 September, 6:30 PM'], ['Format', 'Online — Zoom'], ['Hosted by', 'Atlas banking partner'], ['Capacity', '200 spots']],
        attendees: true
      }
    },
    guide: {
      gp: {
        title: 'Registering with a GP in your first week', eyebrow: '6 min read', cta: 'Mark as read',
        body: [
          "Every international student in the UK is entitled to free NHS care once you've paid the Immigration Health Surcharge as part of your visa — but you have to actively register with a local GP practice, it doesn't happen automatically.",
          "Do this in your first week, even if you're not sick. Registration can take a few days to process, and you'll want an active GP on record before you ever need urgent care.",
          "Bring your BRP or visa decision letter, proof of address (a tenancy agreement or a letter from student housing works), and your passport. Most practices near campus have an online registration form — search '[your postcode] GP registration' or ask your accommodation office for the nearest practice."
        ],
        facts: [['Read time', '6 minutes'], ['Category', 'Healthcare'], ['Applies to', 'All visa holders']],
        author: { name: 'Nikhil', role: 'Content team', img: 'https://i.pravatar.cc/100?img=26' }
      },
      counciltax: {
        title: 'Council tax exemption for students', eyebrow: '4 min read', cta: 'Mark as read',
        body: [
          "Full-time students in the UK are exempt from council tax — but the exemption isn't automatic. You need to request a Council Tax Exemption Certificate from your university and submit it to your local council.",
          "If you're in a shared house where everyone is a full-time student, the whole property is exempt. If even one housemate isn't a full-time student, the property may only get a discount rather than a full exemption — worth checking before you sign a lease.",
          "This one form can save several hundred pounds a year, and councils have been known to bill full council tax by default if they never receive proof of your student status."
        ],
        facts: [['Read time', '4 minutes'], ['Category', 'Money'], ['Saves', '£300–£600/yr']],
        author: { name: 'Rohan', role: 'Content team', img: 'https://i.pravatar.cc/100?img=15' }
      },
      credit: {
        title: 'Building UK credit history from zero', eyebrow: '5 min read', cta: 'Mark as read',
        body: [
          "You arrive in the UK with no credit history at all — which can make it harder to rent, get a phone contract, or qualify for a credit card later, even once you're earning through the Graduate visa route.",
          "The fastest legitimate way to start building history is a secured or student credit card used lightly and paid off in full every month, alongside registering on the electoral roll if you're eligible, which many lenders check automatically.",
          "Start this in your first term, not your last — UK credit history typically needs 6–12 months of activity before it meaningfully affects what you're approved for."
        ],
        facts: [['Read time', '5 minutes'], ['Category', 'Money'], ['Best started', 'Term 1']],
        author: { name: 'Meera', role: 'Content team', img: 'https://i.pravatar.cc/100?img=33' }
      }
    }
  };

  const params = new URLSearchParams(location.search);
  const type = ITEMS[params.get('type')] ? params.get('type') : 'guide';
  const group = ITEMS[type];
  const id = group[params.get('id')] ? params.get('id') : Object.keys(group)[0];
  const item = group[id];

  document.title = item.title + ' — Atlas';
  document.getElementById('crumbTitle').textContent = item.title;
  document.getElementById('itemTitle').textContent = item.title;
  document.getElementById('itemEyebrow').textContent = item.eyebrow;
  const itemCta = document.getElementById('itemCta');
  itemCta.textContent = item.cta;
  const DONE_LABEL = { job: 'Applied ✓', event: "You're going ✓", guide: 'Marked as read ✓' };
  itemCta.addEventListener('click', () => {
    itemCta.textContent = DONE_LABEL[type];
    itemCta.disabled = true;
  });
  document.getElementById('itemBody').innerHTML = item.body.map(p => `<p>${p}</p>`).join('');
  document.getElementById('factsTitle').textContent = type === 'job' ? 'Role details' : type === 'event' ? 'Event details' : 'At a glance';
  document.getElementById('factsBody').innerHTML = item.facts.map(([k, v]) =>
    `<div><div class="fact-label">${k}</div><div class="fact-value" style="font-size:14px;">${v}</div></div>`
  ).join('');

  if (item.reqs) {
    document.getElementById('reqCard').style.display = '';
    document.getElementById('reqList').innerHTML = item.reqs.map(r =>
      `<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>${r}</li>`
    ).join('');
  }
  if (item.author) {
    document.getElementById('authorCard').style.display = '';
    document.getElementById('authorRow').innerHTML = `<img src="${item.author.img}" alt=""><div><b>${item.author.name}</b><span>${item.author.role}</span></div>`;
  }
  if (item.rsvp) {
    const card = document.getElementById('rsvpCard');
    card.style.display = '';
    document.getElementById('rsvpCount').firstChild.textContent = item.rsvp.going;
    document.getElementById('rsvpHeadline').textContent = item.rsvp.headline;
    document.getElementById('rsvpBody').textContent = item.rsvp.body;
    document.getElementById('rsvpCta').addEventListener('click', () => document.getElementById('itemCta').click());
  }
  if (item.attendees) {
    document.getElementById('factsBody').insertAdjacentHTML('beforeend',
      `<div><div class="fact-label">Going</div><div class="avatar-stack" style="margin-top:6px;">
        <div class="a"><img src="https://i.pravatar.cc/100?img=32" alt=""></div>
        <div class="a"><img src="https://i.pravatar.cc/100?img=12" alt=""></div>
        <div class="a"><img src="https://i.pravatar.cc/100?img=5" alt=""></div>
        <div class="a more">+24</div>
      </div></div>`);
  }

  document.getElementById('backBtn').addEventListener('click', () => {
    if (document.referrer && document.referrer.includes(location.host)) history.back();
    else location.href = 'index.html';
  });

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', () => AtlasUI.boot({ enter: 'slide', slideTarget: '#detailView' }));
  } else {
    AtlasUI.boot({ enter: 'slide', slideTarget: '#detailView' });
  }
})();
</script>
</body>
</html>
