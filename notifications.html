<!DOCTYPE html>
<html lang="en" data-theme="dark">

<style>
  .notif-tabs{ display:flex; gap:6px; padding:14px 22px 0; }
  .notif-tabs button{
    appearance:none; border:none; background:transparent; font-family:inherit;
    font-size:12.5px; font-weight:700; color:var(--ink-soft); padding:7px 12px;
    border-radius:999px; cursor:pointer;
  }
  .notif-tabs button.active{ background:var(--panel); color:var(--ink); }
  .notif-mark-all{ font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .notif-mark-all:hover{ color:var(--ink); }
</style>
<link rel="stylesheet" href="shared/atlas-glass-video.css">
</head>
<body>

  <div class="spotlight" id="spotlight"><div class="spotlight-glow" id="spotlightGlow"></div></div>

  <div class="home-media" aria-hidden="true">
    <video src="assets/home-bg.mp4" autoplay muted loop playsinline preload="auto"></video>
    <div class="hm-scrim"></div>
    <div class="hm-grain"></div>
  </div>

  <div class="screen">
    <div class="app">
      <nav class="sidebar" id="sidebarRail" aria-label="Tools">
        <div class="side-btn" title="Search" onclick="location.href='index.html?search=1'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
        <div class="side-btn" title="Messages" onclick="location.href='messaging.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="side-dot"></span></div>
        <div class="side-btn" title="Document checklist" onclick="location.href='checklist.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg></div>
        <div class="side-btn" title="Help &amp; support" onclick="location.href='index.html?help=1'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 2-2.4 3.7"/><path d="M12 17.2v.1"/></svg></div>
        <div class="side-gap"></div>
        <div class="side-btn" title="Settings" onclick="location.href='profile.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg></div>
        <div class="side-btn" id="themeToggle" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </div>
      </nav>

      <div class="main">
        <div class="topbar">
          <div class="brand">
            <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2L2 21h20L12 2z"/><path d="M12 9l4.5 9h-9L12 9z" opacity=".5"/></svg></span>
            atlas
          </div>
          <nav class="pillnav" aria-label="Sections" style="opacity:.5; pointer-events:none;">
            <button class="active">Home</button><button>Journey</button><button>Services</button><button>Community</button>
          </nav>
          <div class="top-right">
            <div class="icon-btn" id="bellBtn" title="Notifications" role="button" tabindex="0">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="side-dot" id="bellDot"></span>
            </div>
            <div class="profile-btn" title="Account menu" onclick="location.href='profile.html'">
              <div class="avatar-ring"><img src="https://i.pravatar.cc/100?img=47" alt="Harman"></div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="11" height="11"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>

        <!-- a real fragment of Home, so the drawer has genuine context behind it -->
        <div class="view active" style="padding:30px 32px 40px;">
          <div class="j-head">
            <div><h1>Welcome back, Harman</h1><p>You're in the visa stage now. Pre-departure unlocks on visa approval.</p></div>
          </div>
          <div class="stat-row" style="max-width:640px;">
            <div class="card"><div class="stat-num">2</div><div class="stat-lbl">Applications</div></div>
            <div class="card"><div class="stat-num">2</div><div class="stat-lbl">Offers</div></div>
            <div class="card"><div class="stat-num">9/13</div><div class="stat-lbl">Documents</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="drawer-backdrop" id="backdrop"></div>
    <aside class="drawer" id="drawer" aria-label="Notifications">
      <div class="drawer-head">
        <h3>Notifications</h3>
        <div class="drawer-close" id="drawerClose" role="button" tabindex="0" aria-label="Close notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </div>
      </div>
      <div class="notif-tabs">
        <button class="active" data-f="all">All</button>
        <button data-f="unread">Unread</button>
      </div>
      <div style="display:flex; justify-content:flex-end; padding:10px 22px 0;">
        <span class="notif-mark-all" id="markAll">Mark all as read</span>
      </div>
      <div class="drawer-body" id="notifList"></div>
    </aside>
  </div>

<script src="shared/atlas-shared.js"></script>
<script>
(function(){
  const NOTIFS = [
    { icon: 'coral', unread: true, time: '2h ago', title: 'Visa biometrics appointment', body: '6 days left — book your slot at the Manchester visa centre.', svg: '<path d="M12 8v5M12 16v.1"/><circle cx="12" cy="12" r="9"/>' },
    { icon: 'blue', unread: true, time: '5h ago', title: 'New message from Priya S.', body: '"Your SOP looks ready — go ahead and submit whenever you\'re set."', svg: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>' },
    { icon: 'green', unread: true, time: '1d ago', title: 'Offer accepted — University of Manchester', body: 'Your deposit has been confirmed. Next: the visa stage.', svg: '<path d="M20 6L9 17l-5-5"/>' },
    { icon: 'gold', unread: false, time: '2d ago', title: 'New event: Pre-departure briefing', body: '3 Sept · Online — hosted by students already in Manchester.', svg: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>' },
    { icon: 'coral', unread: false, time: '3d ago', title: 'Financial evidence check due', body: 'Due 4 September — upload your forex transfer receipt.', svg: '<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' },
    { icon: 'blue', unread: false, time: '4d ago', title: 'CAS number requested', body: "James O. has submitted your CAS request to the university.", svg: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/>' },
    { icon: 'green', unread: false, time: '6d ago', title: 'Shortlist confirmed with advisor', body: 'Manchester, UCL and Leeds — all locked in for MSc Data Science.', svg: '<path d="M20 6L9 17l-5-5"/>' }
  ];

  const list = document.getElementById('notifList');
  const tabs = document.querySelector('.notif-tabs');
  let filter = 'all';

  function render(){
    const shown = NOTIFS.filter(n => filter === 'all' || n.unread);
    list.innerHTML = shown.map(n => `
      <div class="notif-row ${n.unread ? 'unread' : ''}">
        <div class="notif-icon ${n.icon}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${n.svg}</svg></div>
        <div class="notif-text"><b>${n.title}</b><span>${n.body}</span></div>
        <span class="notif-time">${n.time}</span>
      </div>
    `).join('') || '<div class="empty on"><b>You\'re all caught up</b>No unread notifications right now.</div>';
  }
  render();

  tabs.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    tabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.f;
    render();
  });

  document.getElementById('markAll').addEventListener('click', () => {
    NOTIFS.forEach(n => n.unread = false);
    document.getElementById('bellDot').remove();
    render();
  });

  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('backdrop');
  const bellBtn = document.getElementById('bellBtn');
  const closeBtn = document.getElementById('drawerClose');

  function open(){ AtlasUI.openDrawer(drawer, backdrop); }
  function close(){ AtlasUI.closeDrawer(drawer, backdrop); }

  bellBtn.addEventListener('click', () => drawer.classList.contains('on') ? close() : open());
  closeBtn.addEventListener('click', close);
  backdrop.addEventListener('click', close);

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', () => { AtlasUI.boot(); open(); });
  } else {
    AtlasUI.boot(); open();
  }
})();
</script>
</body>
</html>
