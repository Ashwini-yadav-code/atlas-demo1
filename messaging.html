<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/atlas-design-system.css">
<link rel="stylesheet" href="shared/atlas-extended.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  .msg-view{ padding:0 !important; display:flex; height:calc(100vh - 78px); }
  .msg-list{ width:320px; flex:none; border-right:1px solid var(--line); overflow-y:auto; }
  .msg-list-head{ padding:20px 20px 12px; font-family:'Montserrat',sans-serif; font-weight:800; font-size:19px; letter-spacing:-.02em; }
  .msg-item{
    display:flex; gap:12px; align-items:flex-start; padding:13px 20px;
    cursor:pointer; border-left:2px solid transparent;
  }
  .msg-item:hover{ background:var(--panel); }
  .msg-item.active{ background:var(--blue-soft); border-left-color:var(--blue); }
  .msg-item .p-avatar{ width:42px; height:42px; flex:none; }
  .msg-item-body{ flex:1; min-width:0; }
  .msg-item-body .name{ font-size:13.5px; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .msg-item-body .role{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .msg-item-body .preview{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msg-item.unread .preview{ color:var(--ink); font-weight:600; }
  .msg-item-time{ font-size:11px; color:var(--ink-faint); flex:none; }
  .msg-unread-badge{ min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--coral); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }

  .msg-thread{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .msg-thread-head{ display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--line); }
  .msg-thread-head .p-avatar{ width:38px; height:38px; }
  .msg-thread-head b{ font-size:14.5px; display:block; }
  .msg-thread-head span{ font-size:12px; color:var(--ink-soft); }
  .msg-back{ display:none; }

  .msg-bubbles{ flex:1; overflow-y:auto; padding:22px 24px; display:flex; flex-direction:column; gap:14px; }
  .bubble-row{ display:flex; gap:10px; max-width:72%; }
  .bubble-row.own{ align-self:flex-end; flex-direction:row-reverse; }
  .bubble-row .p-avatar{ width:28px; height:28px; flex:none; }
  .bubble{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:11px 14px; font-size:13.5px; line-height:1.5; }
  .bubble-row.own .bubble{ background:var(--blue-soft); border-color:transparent; }
  .bubble-time{ font-size:10.5px; color:var(--ink-faint); margin-top:4px; }
  .bubble-row.own .bubble-time{ text-align:right; }

  .msg-composer{ display:flex; gap:10px; align-items:center; padding:16px 24px; border-top:1px solid var(--line); }
  .msg-composer .field-input{ flex:1; }
  .msg-send{ width:40px; height:40px; border-radius:12px; background:var(--accent); color:var(--panel); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .msg-send svg{ width:16px; height:16px; }

  @media (max-width:760px){
    .msg-list{ width:100%; border-right:none; }
    .msg-view.chat-open .msg-list{ display:none; }
    .msg-view:not(.chat-open) .msg-thread{ display:none; }
    .msg-back{ display:flex; }
  }
</style>
</head>
<body>

  <div class="spotlight" id="spotlight"><div class="spotlight-glow" id="spotlightGlow"></div></div>

  <div class="screen">
    <div class="app">
      <nav class="sidebar" id="sidebarRail" aria-label="Tools">
        <div class="side-btn" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
        <div class="side-btn active" title="Messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
        <div class="side-btn" title="Document vault" onclick="location.href='checklist.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg></div>
        <div class="side-btn" title="Help &amp; support"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 2-2.4 3.7"/><path d="M12 17.2v.1"/></svg></div>
        <div class="side-gap"></div>
        <div class="side-btn" title="Settings" onclick="location.href='profile.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg></div>
        <div class="side-btn" id="themeToggle" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </div>
      </nav>

      <div class="main">
        <div class="topbar">
          <div class="brand">
            <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2L2 21h20L12 2z"/><path d="M12 9l4.5 9h-9L12 9z" opacity=".5"/></svg></span>
            atlas
          </div>
          <div class="topbar-back">
            <div class="back-btn" id="backBtn" role="button" tabindex="0">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              Back
            </div>
            <div class="breadcrumb"><a href="index.html" style="color:inherit; text-decoration:none;">Home</a><span class="sep">/</span><span class="current">Messages</span></div>
          </div>
          <div class="top-right">
            <div class="icon-btn" title="Notifications" onclick="location.href='notifications.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
            <div class="profile-btn" title="Account menu">
              <div class="avatar-ring"><img src="https://i.pravatar.cc/100?img=47" alt="Harman"></div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="11" height="11"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>

        <div class="msg-view" id="msgView">
          <div class="msg-list" id="msgList">
            <div class="msg-list-head">Messages</div>
          </div>
          <div class="msg-thread">
            <div class="msg-thread-head">
              <div class="back-btn msg-back" id="msgBack" role="button" tabindex="0">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              </div>
              <div class="p-avatar" id="threadAvatar"></div>
              <div><b id="threadName"></b><span id="threadRole"></span></div>
            </div>
            <div class="msg-bubbles" id="msgBubbles"></div>
            <div class="msg-composer">
              <input class="field-input" id="composerInput" placeholder="Write a message…" autocomplete="off">
              <div class="msg-send" id="sendBtn" role="button" tabindex="0" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="shared/atlas-shared.js"></script>
<script>
(function(){
  const THREADS = {
    priya: {
      name: 'Priya S.', role: 'Application advisor', img: 'https://i.pravatar.cc/100?img=32', unread: 2,
      messages: [
        { own: false, text: "Hi Harman! I've reviewed your SOP draft for Manchester — a few small notes inline, but overall it's strong.", time: '9:14 AM' },
        { own: true, text: "Thanks Priya! I'll fix those tonight.", time: '9:20 AM' },
        { own: false, text: "Perfect — once it's in, I'll submit it alongside your academic references.", time: '9:22 AM' },
        { own: false, text: 'Your SOP looks ready — go ahead and submit whenever you’re set.', time: 'Yesterday' },
        { own: true, text: 'Submitted! 🎉', time: 'Yesterday' }
      ]
    },
    james: {
      name: 'James O.', role: 'Visa specialist', img: 'https://i.pravatar.cc/100?img=12', unread: 1,
      messages: [
        { own: false, text: 'Hi Harman, once your CAS number comes through, we’ll need to book biometrics within 15 days.', time: 'Mon' },
        { own: true, text: 'Got it — should I request the CAS number now?', time: 'Mon' },
        { own: false, text: "Yes, go ahead and request it. I'll flag the financial evidence deadline once that's in.", time: 'Tue' }
      ]
    }
  };

  const list = document.getElementById('msgList');
  const view = document.getElementById('msgView');
  let activeId = 'priya';

  function renderList(){
    list.querySelectorAll('.msg-item').forEach(el => el.remove());
    Object.entries(THREADS).forEach(([id, t]) => {
      const last = t.messages[t.messages.length - 1];
      const el = document.createElement('div');
      el.className = 'msg-item' + (id === activeId ? ' active' : '') + (t.unread ? ' unread' : '');
      el.dataset.id = id;
      el.innerHTML = `
        <div class="p-avatar"><img src="${t.img}" alt=""></div>
        <div class="msg-item-body">
          <div class="name">${t.name} <span class="msg-item-time">${last.time}</span></div>
          <div class="role">${t.role}</div>
          <div class="preview">${last.own ? 'You: ' : ''}${last.text}</div>
        </div>
        ${t.unread ? `<div class="msg-unread-badge">${t.unread}</div>` : ''}
      `;
      list.appendChild(el);
    });
  }

  function renderThread(id){
    const t = THREADS[id];
    activeId = id;
    t.unread = 0;
    document.getElementById('threadAvatar').innerHTML = `<img src="${t.img}" alt="">`;
    document.getElementById('threadName').textContent = t.name;
    document.getElementById('threadRole').textContent = t.role;
    document.getElementById('msgBubbles').innerHTML = t.messages.map(m => `
      <div class="bubble-row ${m.own ? 'own' : ''}">
        ${m.own ? '' : `<div class="p-avatar"><img src="${t.img}" alt=""></div>`}
        <div><div class="bubble">${m.text}</div><div class="bubble-time">${m.time}</div></div>
      </div>
    `).join('');
    renderList();
    view.classList.add('chat-open');
    const bubbles = document.getElementById('msgBubbles');
    bubbles.scrollTop = bubbles.scrollHeight;
  }

  list.addEventListener('click', (e) => {
    const item = e.target.closest('.msg-item');
    if (item) renderThread(item.dataset.id);
  });

  document.getElementById('msgBack').addEventListener('click', () => view.classList.remove('chat-open'));

  function send(){
    const input = document.getElementById('composerInput');
    const text = input.value.trim();
    if (!text) return;
    THREADS[activeId].messages.push({ own: true, text, time: 'Now' });
    input.value = '';
    renderThread(activeId);
    document.getElementById('composerInput').focus();
  }
  document.getElementById('sendBtn').addEventListener('click', send);
  document.getElementById('composerInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

  document.getElementById('backBtn').addEventListener('click', () => {
    if (document.referrer && document.referrer.includes(location.host)) history.back();
    else location.href = 'index.html';
  });

  const requestedThread = new URLSearchParams(location.search).get('thread');
  renderThread(THREADS[requestedThread] ? requestedThread : 'priya');

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', () => AtlasUI.boot());
  } else {
    AtlasUI.boot();
  }
})();
</script>
</body>
</html>
