<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<script src="shared/atlas-auth-gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar — Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/atlas-design-system.css">
<link rel="stylesheet" href="shared/atlas-extended.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  .cal-head{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .cal-head h2{ font-family:'Montserrat',sans-serif; font-weight:700; font-size:18px; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-dow{ font-size:11px; font-weight:700; color:var(--ink-soft); text-align:center; text-transform:uppercase; letter-spacing:.05em; padding-bottom:6px; }
  .cal-cell{
    min-height:88px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--card);
    padding:8px; display:flex; flex-direction:column; gap:4px; cursor:default;
  }
  .cal-cell.empty{ background:transparent; border-color:transparent; }
  .cal-cell.has-items{ cursor:pointer; }
  .cal-cell.has-items:hover{ box-shadow:var(--shadow-card-hover); }
  .cal-cell.today{ border-color:var(--blue); box-shadow:0 0 0 2px var(--blue-soft); }
  .cal-daynum{ font-size:12px; font-weight:700; color:var(--ink-soft); }
  .cal-item-dot{ font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:6px; line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-item-dot.task{ background:var(--blue-soft); color:var(--blue); }
  .cal-item-dot.task.urgent{ background:var(--coral-soft); color:var(--coral); }
  .cal-item-dot.event{ background:var(--gold-soft); color:#8a5a06; }
  [data-theme="dark"] .cal-item-dot.event{ color:var(--gold); }

  .cal-list-row{ display:flex; align-items:center; gap:14px; padding:13px 16px; cursor:pointer; }
  .cal-list-row:hover{ background:var(--panel); border-radius:14px; }
  .cal-list-date{ width:52px; flex:none; text-align:center; }
  .cal-list-date b{ display:block; font-family:'Montserrat',sans-serif; font-size:17px; }
  .cal-list-date span{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; }
  @media (max-width:700px){ .cal-cell{ min-height:60px; } .cal-item-dot{ font-size:0; padding:0; width:6px; height:6px; border-radius:50%; } }
</style>
</head>
<body>

  <div class="spotlight" id="spotlight"><div class="spotlight-glow" id="spotlightGlow"></div></div>

  <div class="screen">
    <div class="app">
      <nav class="sidebar" id="sidebarRail" aria-label="Tools">
        <div class="side-btn" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
        <div class="side-btn" title="Messages" onclick="location.href='messaging.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
        <div class="side-btn" title="Document checklist" onclick="location.href='checklist.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg></div>
        <div class="side-btn" title="Help &amp; support"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.9.8c0 1.7-2.4 2-2.4 3.7"/><path d="M12 17.2v.1"/></svg></div>
        <div class="side-gap"></div>
        <div class="side-btn" title="Settings" onclick="location.href='profile.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg></div>
        <div class="side-btn" id="themeToggle" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </div>
      </nav>

      <div class="main">
        <div class="topbar">
          <div class="brand">
            <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2L2 21h20L12 2z"/><path d="M12 9l4.5 9h-9L12 9z" opacity=".5"/></svg></span>
            atlas
          </div>
          <div class="topbar-back">
            <div class="back-btn" id="backBtn" role="button" tabindex="0">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              Back
            </div>
            <div class="breadcrumb"><a href="index.html" style="color:inherit; text-decoration:none;">Journey</a><span class="sep">/</span><span class="current">Calendar</span></div>
          </div>
          <div class="top-right">
            <div class="icon-btn" title="Notifications" onclick="location.href='notifications.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
            <div class="profile-btn" title="Account menu">
              <div class="avatar-ring"><img src="https://i.pravatar.cc/100?img=47" alt="Harman"></div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="11" height="11"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>

        <div class="view active" id="detailView">
          <div class="j-head reveal">
            <div><h1>Calendar</h1><p>Every deadline and event from your Journey board, in one place.</p></div>
            <div style="display:flex; gap:10px; align-items:center;">
              <div class="chip-row" id="calTabs" style="margin:0;">
                <button class="chip active" data-v="month">Month</button>
                <button class="chip" data-v="list">List</button>
              </div>
              <button type="button" class="btn btn-secondary btn-sm" id="icsExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M9 16l2 2 4-4"/></svg>Add to your calendar</button>
            </div>
          </div>

          <div class="card reveal" style="padding:22px;" id="monthView">
            <div class="cal-head"><h2>September 2026</h2></div>
            <div class="cal-grid" id="calGrid"></div>
          </div>

          <div class="card reveal" id="listView" style="display:none;">
            <div class="list-card" id="calList" style="margin:8px;"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="drawer-backdrop" id="backdrop"></div>
    <aside class="drawer" id="taskDrawer" aria-label="Task detail">
      <div class="drawer-head">
        <h3 id="taskDrawerHead">Task</h3>
        <div class="drawer-close" id="drawerClose" role="button" tabindex="0" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
      </div>
      <div class="drawer-body" id="taskDrawerBody" style="padding:6px 0 20px;"></div>
    </aside>
  </div>

<script src="shared/atlas-shared.js"></script>
<script>
(function(){
  const EVENTS = {
    2: [{ title: 'Accept your Manchester offer', type: 'task', urgent: true }, { title: 'CAS number requested', type: 'task', urgent: true }],
    3: [{ title: 'Pre-departure briefing: what to pack', type: 'event', href: 'community-detail.html?type=event&id=briefing' }],
    4: [{ title: 'Financial evidence check', type: 'task' }],
    6: [{ title: 'Visa biometrics appointment', type: 'task', urgent: true }],
    8: [{ title: 'Upload IELTS score to profile', type: 'task' }],
    10: [{ title: 'TB test certificate', type: 'task' }, { title: 'New arrivals meetup', type: 'event', href: 'community-detail.html?type=event&id=meetup' }],
    14: [{ title: 'Opening your bank account, live Q&A', type: 'event', href: 'community-detail.html?type=event&id=bankqa' }],
    20: [{ title: 'Compare housing near campus', type: 'task' }]
  };
  const FIRST_WEEKDAY = 2; // Sept 1, 2026 is a Tuesday (Sun=0)
  const DAYS_IN_MONTH = 30;

  const grid = document.getElementById('calGrid');
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
    grid.insertAdjacentHTML('beforeend', `<div class="cal-dow">${d}</div>`);
  });
  for (let i = 0; i < FIRST_WEEKDAY; i++) grid.insertAdjacentHTML('beforeend', '<div class="cal-cell empty"></div>');
  for (let day = 1; day <= DAYS_IN_MONTH; day++) {
    const items = EVENTS[day] || [];
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (items.length ? ' has-items' : '');
    cell.innerHTML = `<div class="cal-daynum">${day}</div>` + items.map(it =>
      `<div class="cal-item-dot ${it.type}${it.urgent ? ' urgent' : ''}">${it.title}</div>`
    ).join('');
    if (items.length) cell.addEventListener('click', () => openDay(day, items));
    grid.appendChild(cell);
  }

  /* ---------- ICS export (atlas-portal-improvements.md §3) ----------
     A real, valid .ics file built from the same EVENTS data the
     calendar renders — every deadline lands in the student's own
     calendar app, not just inside Atlas. */
  function buildIcs(){
    const YEAR = 2026, MONTH = 9; // September 2026, matching the month view above
    const pad = n => String(n).padStart(2, '0');
    const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Atlas//Student Journey//EN', 'CALSCALE:GREGORIAN'];
    Object.keys(EVENTS).forEach(day => {
      EVENTS[day].forEach((item, i) => {
        const dateStr = `${YEAR}${pad(MONTH)}${pad(+day)}`;
        lines.push(
          'BEGIN:VEVENT',
          `UID:atlas-${dateStr}-${i}@atlas`,
          `DTSTAMP:${stamp}`,
          `DTSTART;VALUE=DATE:${dateStr}`,
          `DTEND;VALUE=DATE:${dateStr}`,
          `SUMMARY:[Atlas] ${item.title}`,
          `DESCRIPTION:${item.type === 'event' ? 'Community event' : 'Journey task'} synced from your Atlas calendar.`,
          'END:VEVENT'
        );
      });
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
  document.getElementById('icsExport').addEventListener('click', () => {
    const blob = new Blob([buildIcs()], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'atlas-journey.ics';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  function renderList(){
    const days = Object.keys(EVENTS).map(Number).sort((a, b) => a - b);
    document.getElementById('calList').innerHTML = days.map(day => EVENTS[day].map(it => `
      <div class="row cal-list-row" data-day="${day}">
        <div class="cal-list-date"><b>${day}</b><span>Sept</span></div>
        <div class="row-label">${it.title}</div>
        <span class="cal-item-dot ${it.type}${it.urgent ? ' urgent' : ''}">${it.type === 'event' ? 'Event' : 'Task'}</span>
      </div>
    `).join('')).join('');
    document.querySelectorAll('.cal-list-row').forEach(row => {
      row.addEventListener('click', () => openDay(+row.dataset.day, EVENTS[row.dataset.day]));
    });
  }
  renderList();

  document.getElementById('calTabs').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('#calTabs .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    document.getElementById('monthView').style.display = chip.dataset.v === 'month' ? '' : 'none';
    document.getElementById('listView').style.display = chip.dataset.v === 'list' ? '' : 'none';
  });

  const drawer = document.getElementById('taskDrawer');
  const backdrop = document.getElementById('backdrop');
  function openDay(day, items){
    document.getElementById('taskDrawerHead').textContent = `September ${day}`;
    document.getElementById('taskDrawerBody').innerHTML = items.map(it => `
      <div class="row" style="padding:12px 22px;">
        <div class="mini-btn ${it.type === 'event' ? '' : ''}">${it.type === 'event'
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>'}</div>
        <div class="row-label">${it.title}</div>
        ${it.href ? `<a class="svc-link" href="${it.href}" style="text-decoration:none;">View<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>` : ''}
      </div>
    `).join('');
    AtlasUI.openDrawer(drawer, backdrop);
  }
  function closeDrawer(){ AtlasUI.closeDrawer(drawer, backdrop); }
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);

  document.getElementById('backBtn').addEventListener('click', () => {
    if (document.referrer && document.referrer.includes(location.host)) history.back();
    else location.href = 'index.html';
  });

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', () => AtlasUI.boot({ enter: 'slide', slideTarget: '#detailView' }));
  } else {
    AtlasUI.boot({ enter: 'slide', slideTarget: '#detailView' });
  }
})();
</script>
</body>
</html>
